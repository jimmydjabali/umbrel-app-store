manifestVersion: 1
id: csikosjanos-github-runner
name: GitHub Runner
tagline: Self-hosted GitHub Actions runners with a web UI
icon: https://raw.githubusercontent.com/github/explore/main/topics/actions/actions.png
category: developer
version: "2.0.2"
port: 9200
description: >-
  Self-hosted GitHub Actions runners with a web UI, packaged as an Umbrel app
  so they are managed by umbreld and survive reboots and OTA updates.


  Add, edit, start, stop and remove any number of runners. Each runner has its
  own scope (an organisation or a single repository), name, labels, runner
  group, ephemeral flag and its own GitHub personal access token. Tokens are
  write-only: you enter one once, it is stored on the box (root-only, 0600) and
  is never shown again, returned by the API or written to logs; the UI only
  shows when it was last updated. Each runner shows whether it is online, the
  job it is running and a tail of its log. Changing a runner restarts only that
  runner.


  All runners run in one container, each as its own unprivileged user, so jobs
  cannot read the tokens. The job image is minimal Ubuntu; jobs bring their own
  toolchains via `actions/setup-node`, `actions/setup-python`, etc.

