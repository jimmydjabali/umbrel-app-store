releaseNotes: >-
  2.0.2 — The image is now also built for arm64 (Raspberry Pi 4/5). New
  runners default to the label "umbrel"; GitHub adds self-hosted, Linux and
  the real architecture (X64 or ARM64) itself. 2.0.1 — Fix: runners failed to register ("runner configure failed")
  because /runners was not readable by the runner user. 2.0.0 — Web UI replaces the static status page. Manage several runners
  (org or repo scope, labels, group, ephemeral, enabled), each with its own
  write-only token. The UI now requires your Umbrel login. Upgrading imports
  the existing app-data .env (ORG_NAME / ACCESS_TOKEN) as runner #1 with the
  same name and labels, so workflows keep working. The old .env and
  exports.sh are left untouched so you can roll back (see README). Jobs now
  run as an unprivileged user (no sudo) on Ubuntu 24.04 (runner 2.337.0).
