# Builds the image for the csikosjanos-github-runner app (UI + runner manager)
# and pushes ghcr.io/csikosjanos/github-runner-manager:<app version>.
#
# The tag is the `version` in csikosjanos-github-runner/umbrel-app.yml, which
# the app's docker-compose.yml pins. To release: change the code, bump both.
name: build-github-runner-manager

on:
  workflow_dispatch:
  # Only main publishes images. PRs run the same tests + smoke test on a local
  # build, without pushing, so a branch can never overwrite the released tag.
  push:
    branches: [main]
    paths:
      - csikosjanos-github-runner/manager/**
      - csikosjanos-github-runner/umbrel-app.yml
      - .github/workflows/build-github-runner-manager.yml
  pull_request:
    paths:
      - csikosjanos-github-runner/manager/**
      - csikosjanos-github-runner/umbrel-app.yml
      - .github/workflows/build-github-runner-manager.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/github-runner-manager
  APP_DIR: csikosjanos-github-runner

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        working-directory: ${{ env.APP_DIR }}/manager
        run: python3 -m unittest -v test_manager.py

      - name: Read app version
        id: v
        run: |
          version="$(yq '.version' "$APP_DIR/umbrel-app.yml")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}/manager
          # amd64 (Umbrel Home/Pro, x86 PCs) + arm64 (Raspberry Pi 4/5). PR
          # builds are loaded into the local daemon for the smoke test, which
          # only supports a single platform.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Smoke test (migrate exits 0, host reaches UI, other containers get 403)
        env:
          TAG: ${{ steps.v.outputs.version }}
        run: |
          docker run --rm "$IMAGE:$TAG" python3 /opt/manager/manager.py --migrate
          docker run -d --name runner-manager-smoke -p 8080:8080 "$IMAGE:$TAG"
          # From the host = via the bridge gateway, like umbreld's app gateway.
          for i in $(seq 30); do curl -fs localhost:8080/api/runners && break; sleep 1; done
          curl -fs localhost:8080/ | grep -q "GitHub Runners"
          # From a sibling container = like another Umbrel app: must be refused.
          ip="$(docker inspect -f '{{.NetworkSettings.IPAddress}}' runner-manager-smoke)"
          code="$(docker run --rm curlimages/curl:8.10.1 -s -o /dev/null -w '%{http_code}' "http://$ip:8080/api/runners")"
          echo "sibling container got HTTP $code"
          [ "$code" = 403 ]
          docker logs runner-manager-smoke
